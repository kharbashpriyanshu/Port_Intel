[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portintel"
version = "2.0.0"
description = "Intelligent Network Reconnaissance and Port Analysis Tool"
authors = [
    {name = "Priyanshu Kharbash", email = "author@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["security", "scanner", "reconnaissance", "port-scanner", "cve", "cybersecurity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.25.1",
]

[project.urls]
Homepage = "https://github.com/kharbashpriyanshu/Port_Intel"
Repository = "https://github.com/kharbashpriyanshu/Port_Intel.git"
"Bug Tracker" = "https://github.com/kharbashpriyanshu/Port_Intel/issues"

[project.scripts]
portintel = "portintel.cli.parser:main"

[tool.setuptools.packages.find]
include = ["portintel*"]
exclude = ["tests*", "docs*"]
